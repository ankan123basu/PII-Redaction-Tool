[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-redactor"
version = "1.0.0"
description = "Production-grade PII Redaction Tool for DOCX documents using hybrid regex + NER detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PII Redaction Team"}
]

dependencies = [
    "python-docx>=1.1.0",
    "spacy>=3.7.0",
    "pyyaml>=6.0",
    "faker>=25.0",
    "rich>=13.0",
    "click>=8.1",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.scripts]
pii-redactor = "pii_redactor.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
